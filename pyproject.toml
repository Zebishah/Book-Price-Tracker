[project]
name = "book-price-tracker"
version = "0.1.0"
description = "A REST API for scraping, storing, and retrieving book data."
readme = "README.md"
authors = [
    { name = "Zohaib Haider", email = "zebihaider123@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.15,<2",
    "beautifulsoup4>=4.13,<5",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.8,<3",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
